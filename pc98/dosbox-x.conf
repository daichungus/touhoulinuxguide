[sdl]
# Set "fullscreen" to true if you always want fullscreen on startup
fullscreen = false
fullresolution = desktop
windowresolution = original
windowposition = -
display = 0
output = openglpp
showbasic = true
showdetails = true
showmenu = true

[dosbox]
# Set to PC-98 mode and reserve at least 16 MB of memory
machine = pc98
memsize = 16

[render]
# Maintains the PC-98 original aspect ratio of 16:10.
# On 16:9 displays, there will be large black borders,
# but this is normal and avoids stretching or blurring the graphics.
aspect = true
aspect_ratio = -1:-1

[joystick]
# As far as testing goes, joysticks do not have an equivalent of
# the Shift key.
#
# Note that the ABXY buttons for Nintendo controllers is inverted.
# 
# Autofire should be set to false, since it only affects th03
# If autofire = true, the player(s) using the joystick(s) cannot send
# a charged attack to their opponent in th03.
joystick_type = 2axis
autofire = false

[midi]
# Only th02 has MIDI support, so this is optional
# FluidSynth is the recommended MIDI device for most Linux systems.
# 
# DOSBox-X with FluidSynth enabled will use the default system soundfont.
# However, the Flatpak version of DOSBox-X cannot access system-installed
# soundfonts by default; the user must specify a path of a soundfont
# within a directory that they have read-write permissions to.
#
# By default, fluid.driver = pulseaudio
# but if you have a different fluid.driver, other possible values are
# alsa, oss, coreaudio, dsound, portaudio, sndman, jack, file
#
# TL;DR If you use Flatpak and you want th02 MIDI OST, you must set
# fluid.soundfont = /home/you/path/to/soundfont
# and if you don't like PulseAudio, you can specify a different sound server.
mididevice = fluidsynth
fluid.soundfont = 
fluid.driver = 

[pc98]
# Settings not listed here shouldn't affect the Touhou games,
# though they're worthwhile to check if you're emulating other programs
#
# Set force ibm keyboard layout = true
# if you are not using a Japanese keyboard layout.
#
# If you wish to use a BMP font besides the default one,
# set anex86 font = /path/to/the/fontfile
pc-98 BIOS copyright string              = false
pc-98 fm board                           = auto
pc-98 time stamp                         = true
pc-98 sound bios                         = false
pc-98 load sound bios rom file           = true
pc-98 enable 256-color planar            = true
pc-98 enable 256-color                   = true
pc-98 enable 16-color                    = true
pc-98 enable grcg                        = true
pc-98 enable egc                         = true
pc-98 enable 188 user cg                 = true
pc-98 start gdc at 5mhz                  = false
pc-98 force ibm keyboard layout          = auto 
pc-98 force JIS keyboard layout          = false
pc-98 try font rom                       = true
pc-98 anex86 font                        =
pc-98 show graphics layer on initialize  = true

[video]
# By default, the Touhou games will run between 56 and 58 fps
# To run the games at 60 fps, set the "forcerate" value to 60
forcerate = 

[cpu]
# If possible, set core = dynamic_x86
#
# Depending on your hardware, you may need to adjust the value to a higher or
# lower value in order to have a smooth and playable experience.
#
# Testing by the author shows a general range of 24000 and 80000
# to be the most consistently smooth values on most modern machines.
core = auto 
cycles = 30000

[autoexec]
# Extremely useful for multi-game HDI files or if you usually play one game.
# This is even more useful if you're planning on only using DOSBox-X to play
# the Touhou games.
#
# For HDI files, follow the format shown below, substituting "TOUHOU.HDI" for
# the actual HDI filename as needed.
#
# IMGMOUNT C: TOUHOU.HDI
# BOOT C:
#
# HDI files that automatically boot into the games or a menu will do so, while
# an HDI that simply contains the games will be mounted as a directory.
# 
# For the original game files, assuming this config file is located
# in the default working directory of DOSBox-X, follow the format shown below
# 
# MOUNT A: /path/to/touhou/
# A:
#
# Both absolute and relative paths can be used.
